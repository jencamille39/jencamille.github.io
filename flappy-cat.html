<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Cat Game</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #000, #ff69b4);
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      color: #ffd6eb;
    }
    h1 {
      margin: 20px;
      text-transform: uppercase;
      text-shadow: 2px 2px 8px #000;
    }
    #gameCanvas {
      background: #87CEEB;
      border: 3px solid #ff69b4;
      border-radius: 10px;
      display: block;
      margin: 20px auto;
    }
    #scoreBoard {
      font-size: 1.5em;
      color: #ffd6eb;
    }
    #bestScoreBoard {
      font-size: 1.2em;
      color: #fff;
    }
    #startScreen, #gameOverScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      color: #ffd6eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1.5em;
      text-shadow: 2px 2px 8px #000;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1em;
      background: #ff69b4;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #ff85c1; }
  </style>
</head>
<body>
  <h1>Flappy Cat 🐱</h1>
  <canvas id="gameCanvas" width="400" height="500"></canvas>
  <div id="scoreBoard">Score: 0</div>
  <div id="bestScoreBoard">Best Score: 0</div>

  <!-- Start Screen -->
  <div id="startScreen">
    <h2>Welcome to Flappy Cat!</h2>
    <p>Press SPACE to jump and avoid the walls!</p>
    <button id="startBtn">Start Game</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" style="display:none;">
    <h2>Game Over!</h2>
    <p id="finalScore"></p>
    <p id="bestScoreMsg"></p>
    <button id="retryBtn">Try Again</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreBoard = document.getElementById("scoreBoard");
    const bestScoreBoard = document.getElementById("bestScoreBoard");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const startBtn = document.getElementById("startBtn");
    const retryBtn = document.getElementById("retryBtn");
    const finalScore = document.getElementById("finalScore");
    const bestScoreMsg = document.getElementById("bestScoreMsg");

    let catY, velocity, gravity, jump, pipes, score, gameRunning, pipeInterval, speed;
    const catImg = new Image();
    catImg.src = "flying-cat.jpg";
    let bestScore = localStorage.getItem("bestScore") || 0;
    bestScoreBoard.textContent = "Best Score: " + bestScore;

    function resetGame() {
      catY = 200;
      velocity = 0;
      gravity = 0.5;
      jump = -8;
      pipes = [];
      score = 0;
      speed = 2; // start slow
      gameRunning = false;
      scoreBoard.textContent = "Score: 0";
      clearInterval(pipeInterval);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCat();
    }

    function drawCat() {
      // smaller size: 30x30
      ctx.drawImage(catImg, 80, catY - 15, 30, 30);
    }

    function drawPipes() {
      ctx.fillStyle = "#000";
      pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, 50, pipe.top);
        ctx.fillRect(pipe.x, pipe.top + 120, 50, canvas.height - pipe.top - 120);
      });
    }

    function update() {
      if (!gameRunning) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      velocity += gravity;
      catY += velocity;

      drawCat();
      drawPipes();

      pipes.forEach(pipe => {
        pipe.x -= speed;
        if (pipe.x + 50 < 0) {
          pipes.shift();
          score++;
          scoreBoard.textContent = "Score: " + score;

          // every 5 points, increase speed slightly
          if (score % 5 === 0) {
            speed += 0.5;
          }
        }
        if (
          100 + 15 > pipe.x &&
          100 - 15 < pipe.x + 50 &&
          (catY - 15 < pipe.top || catY + 15 > pipe.top + 120)
        ) {
          endGame();
        }
      });

      if (catY + 15 > canvas.height || catY - 15 < 0) {
        endGame();
      }

      if (gameRunning) requestAnimationFrame(update);
    }

    function spawnPipe() {
      if (!gameRunning) return;
      let top = Math.floor(Math.random() * 200) + 50;
      pipes.push({ x: canvas.width, top: top });
    }

    function startGame() {
      startScreen.style.display = "none";
      gameOverScreen.style.display = "none";
      gameRunning = true;
      pipes = [];
      score = 0;
      catY = 200;
      velocity = 0;
      speed = 2;
      scoreBoard.textContent = "Score: 0";
      pipeInterval = setInterval(spawnPipe, 2000);
      update();
    }

    function endGame() {
      gameRunning = false;
      clearInterval(pipeInterval);
      finalScore.textContent = "Your Score: " + score;

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("bestScore", bestScore);
      }
      bestScoreBoard.textContent = "Best Score: " + bestScore;
      bestScoreMsg.textContent = "Best Score: " + bestScore;

      gameOverScreen.style.display = "flex";
    }

    startBtn.addEventListener("click", startGame);
    retryBtn.addEventListener("click", () => {
      gameOverScreen.style.display = "none";
      startGame();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (gameRunning) {
          velocity = jump;
        }
      }
    });

    catImg.onload = resetGame;
  </script>
</body>
</html>
