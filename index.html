<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rey Jen Camille - Home</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #000, #ff69b4);
      color: #fff;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: rgba(0,0,0,0.7);
    }

    header h1 {
      font-size: 2.8em;
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .motto {
      font-style: italic;
      margin-top: 15px;
      font-size: 1.2em;
      color: #ffd6eb;
    }

    .boxes {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin: 50px;
    }

    .box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 20px;
      width: 280px;
      text-align: center;
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s, background 0.3s;
    }

    .box:hover {
      transform: translateY(-10px) scale(1.05);
      background: rgba(255,255,255,0.2);
    }

    .box img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      border: 3px solid #ff69b4;
      box-shadow: 0 5px 10px rgba(0,0,0,0.5);
    }

    .box a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      font-size: 20px;
      display: block;
    }

    .socials {
      text-align: center;
      margin: 40px;
    }

    .socials a {
      color: #ffd6eb;
      text-decoration: none;
      font-weight: bold;
      margin: 0 10px;
      transition: color 0.3s;
    }

    .socials a:hover {
      color: #fff;
    }

    footer {
      background: rgba(0,0,0,0.8);
      color: #fff;
      text-align: center;
      padding: 20px;
      font-size: 1em;
    }

    footer a {
      color: #ffd6eb;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p class="motto">"Embrace the chaos, trust the process, and never stop learning."</p>
  </header>

  <!-- Boxes linking to other pages -->
  <section class="boxes">
    <div class="box">
      <img src="images/me.jpg" alt="All About Me">
      <a href="all-about-me.html">All About Me</a>
    </div>
    <div class="box">
      <img src="images/army.jpg" alt="My Dreams">
      <a href="my-dreams.html">My Dreams</a>
    </div>
    <div class="box">
      <img src="images/cat.jpg" alt="Random Things">
      <a href="random-things.html">Random Things</a>
    </div>
  </section>

  <!-- Social links -->
  <section class="socials">
    <h2>Connect with me</h2>
    <p>
      <a href="https://www.facebook.com/share/1EBRJyQ9ca/" target="_blank">Facebook</a> |
      <a href="https://www.instagram.com/j_en.14?igsh=MTUwdXZzMmVma2drcw==" target="_blank">Instagram</a> |
      <a href="https://www.tiktok.com/@jencamille14?_r=1&_t=ZS-9882YDMmXib" target="_blank">TikTok</a>
    </p>
  </section>

  <!-- Footer -->
  <footer>
    <p>📞 09121994848 | 📧 <a href="mailto:jencamille39@gmail.com">jencamille39@gmail.com</a></p>
  </footer>
</body>
</html>
