<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All About Me - Rey Jen Camille</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #ff0080);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: rgba(0,0,0,0.7);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    header h1 {
      font-size: 3em;
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffd6eb;
      text-shadow: 0 0 15px #ff69b4, 0 0 25px #e94560;
      animation: glowPulse 3s infinite alternate;
    }

    @keyframes glowPulse {
      from { text-shadow: 0 0 15px #ff69b4; }
      to { text-shadow: 0 0 35px #e94560; }
    }

    .intro {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 40px;
      margin: 60px;
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .pic-box {
      width: 320px;
      height: 400px;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      border: 4px solid #ff69b4;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.3s;
      font-size: 1.5em;
      text-shadow: 0 0 10px #ff69b4;
      animation: bounceBox 3s infinite ease-in-out; /* box jumps */
    }

    @keyframes bounceBox {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .pic-box img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .intro-text {
      max-width: 600px;
      font-size: 1.2em;
      line-height: 1.8;
      color: #ffd6eb;
    }

    .word {
      display: inline-block;
      opacity: 0;
      transform: translateX(50px);
      animation: wordSlide 0.8s forwards;
      margin-right: 6px; /* spacing between words */
    }

    @keyframes wordSlide {
      0% { opacity: 0; transform: translateX(50px) translateY(0); }
      50% { opacity: 1; transform: translateX(0) translateY(-8px); }
      100% { opacity: 1; transform: translateX(0) translateY(0); }
    }

    footer {
      background: rgba(0,0,0,0.85);
      color: #fff;
      text-align: center;
      padding: 20px;
      font-size: 1em;
    }

    footer a {
      color: #ffd6eb;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
      text-shadow: 0 0 10px #ff69b4;
    }

    /* Flower rain effect */
    .flower {
      position: fixed;
      top: -50px;
      width: 35px;
      height: 35px;
      background: radial-gradient(circle, #ff69b4 40%, transparent 70%);
      border-radius: 50%;
      animation: fall linear infinite;
      pointer-events: none;
      opacity: 0.8;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <h1>All About Me</h1>
  </header>

  <section class="intro">
    <!-- Picture box starts blank -->
    <div class="pic-box" onclick="showPic()">
      <span>Click here</span>
      <img src="Jen.jpg.jpg" alt="Rey Jen Camille" id="myPic">
    </div>

    <div class="intro-text" id="introText"></div>
  </section>

  <footer>
    <p>📞 09121994848 | 📧 <a href="mailto:jencamille39@gmail.com">jencamille39@gmail.com</a></p>
  </footer>

  <!-- Flower rain script -->
  <script>
    function createFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flower');
      flower.style.left = Math.random() * window.innerWidth + 'px';
      flower.style.animationDuration = (5 + Math.random() * 5) + 's';
      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 10000);
    }
    setInterval(createFlower, 250);

    // Show picture when clicked
    function showPic() {
      document.getElementById('myPic').style.display = 'block';
      document.querySelector('.pic-box span').style.display = 'none';
    }

    // Improved English text
    const text = `Hello! I’m Rey Jen Camille D., born on October 11, 2006 in the beautiful town of Taal, Batangas. I grew up with one sibling, and as the youngest, I have always been cheerful, talkative, and playful.

People often say I bring energy wherever I go — I am lively, outgoing, and I love making sure no one feels bored when I’m around. At the same time, I am soft‑hearted and kind, someone who forgives easily even when I’ve been hurt. My roots are in both Marinduque and Batangas, and those places shaped the person I am today.

My favorite colors are black and pink — they reflect both sides of me: bold and strong, yet sweet and caring. I am the type of person who genuinely values everyone, and even small things can touch me deeply. That’s just who I am: a mix of laughter, kindness, and sincerity.`;

    const container = document.getElementById('introText');
    let delay = 0;
    const words = text.split(" ");
    for (let word of words) {
      const span = document.createElement('span');
      span.textContent = word;
      span.classList.add('word');
      span.style.animationDelay = delay + 's';
      container.appendChild(span);
      delay += 0.15; // each word jumps in sequence
    }
  </script>
</body>
</html>
